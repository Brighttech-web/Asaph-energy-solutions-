<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | Asaph Energy Solutions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">ASAPH <span>ENERGY</span></div>

    <nav>
        <a href="admin.html">Dashboard</a>
        <a href="index.html">View Store</a>
        <a href="products.html">Store Products</a>
    </nav>

    <div class="header-actions">
        <a href="login.html">Logout</a>
    </div>
</header>

<main class="admin-container">

    <section class="admin-welcome">
        <h1>Manage Products</h1>
        <p>Add, update and manage products displayed in your online store.</p>
    </section>

    <section class="admin-product-form">

        <h2>Add a New Product</h2>

        <form id="adminProductForm">

            <label for="productName">Product Name</label>
            <input type="text" id="productName"
                   placeholder="e.g. 500W Solar Panel" required>

            <label for="productCategory">Product Category</label>
            <select id="productCategory" required>
                <option value="">Select category</option>
                <option value="Solar Panels">Solar Panels</option>
                <option value="Inverters">Inverters</option>
                <option value="Batteries">Batteries</option>
                <option value="Charge Controllers">Charge Controllers</option>
                <option value="Solar Accessories">Solar Accessories</option>
                <option value="Complete Solar Systems">Complete Solar Systems</option>
            </select>

            <label for="productPrice">Product Price (₦)</label>
            <input type="number" id="productPrice"
                   placeholder="Enter price" min="0" required>

            <label for="productStock">Available Quantity</label>
            <input type="number" id="productStock"
                   placeholder="Enter quantity" min="0" required>

            <label for="productImage">Product Image URL</label>
            <input type="url" id="productImage"
                   placeholder="Enter image URL">

            <label for="productDescription">Product Description</label>
            <textarea id="productDescription"
                      placeholder="Describe the product..."
                      rows="5" required></textarea>

            <button type="submit">Add Product</button>

            <p id="adminProductMessage"></p>

        </form>

    </section>

    <section class="admin-product-list">

        <h2>Existing Products</h2>

        <div id="adminProductsList">
            <p>Your products will appear here.</p>
        </div>

    </section>

</main>

<footer>
    <div class="footer-content">
        <h2>ASAPH ENERGY SOLUTIONS</h2>
        <p>Product Management Centre</p>
        <p class="copyright">© 2026 Asaph Energy Solutions.</p>
    </div>
</footer>

<script src="script.js"></script>

</body>
</html>
