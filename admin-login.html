
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Asaph Energy Solutions</title>
    <link rel="stylesheet" href="./style.css">

    <style>
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f5f8;
            padding: 20px;
        }

        .admin-login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .admin-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-logo h1 {
            color: #102c4e;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .admin-logo span {
            color: #c49a38;
            font-size: 13px;
            letter-spacing: 3px;
        }

        .admin-login-box h2 {
            text-align: center;
            color: #102c4e;
            margin-bottom: 10px;
        }

        .admin-login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .admin-login-box label {
            display: block;
            margin: 15px 0 7px;
            color: #333;
            font-weight: 600;
        }

        .admin-login-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        .admin-login-box button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #102c4e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .admin-login-box button:hover {
            background: #c49a38;
        }

        .admin-back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #102c4e;
            text-decoration: none;
        }

        .security-note {
            font-size: 12px;
            margin-top: 20px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="admin-login-page">

    <div class="admin-login-box">

        <div class="admin-logo">
            <h1>ASAPH</h1>
            <span>ENERGY SOLUTIONS</span>
        </div>

        <h2>Admin Login</h2>
        <p>Authorised administrators only</p>

        <form id="adminLoginForm">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter admin username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Sign In</button>

        </form>

        <a href="index.html" class="admin-back">← Back to Website</a>

        <div class="security-note">
            This page is a login design only. Secure authentication
            will be connected before the dashboard is used.
        </div>

    </div>

</div>

<script>
    document.getElementById("adminLoginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Login authentication has not been connected yet.");
    });
</script>

</body>
</html>
